[project]
name = "realhrsoftdummy"
version = "0.1.0"
description = "A stand-in for RealHRSoft's side of the Marketplace integration (development and pilot rehearsal)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django (>=5.2,<6.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "pyjwt[crypto] (>=2.10,<3.0)",
    "requests (>=2.32,<3.0)",
    "gunicorn (>=26.2,<27)",
    "whitenoise (>=6.9,<7)",
    "psycopg[binary] (>=3.3.6,<4)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
]

[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
known_first_party = ["config", "directory", "portal", "signing", "sync"]
skip_glob = ["**/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
# Static files are collected only in Docker; whitenoise notes the missing directory.
filterwarnings = ["ignore:No directory at:UserWarning"]
