{% extends "portal/base.html" %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 48px auto;">
  <h2>Sign in</h2>
  {% if form.errors %}<p style="color: #c62828;">Wrong username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>Username<br><input name="username" autofocus required></label></p>
    <p><label>Password<br><input name="password" type="password" required></label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
